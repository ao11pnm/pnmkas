<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mekaar AO - Simpel</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .view-section { display: none; }
        .view-section.active { display: flex; }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 font-sans h-screen overflow-hidden flex justify-center">

    <main class="w-full max-w-md bg-white h-full relative flex flex-col overflow-hidden shadow-lg">

        <!-- VIEW 1: DASHBOARD -->
        <section id="view-dashboard" class="view-section active flex-col h-full w-full">
            
            <!-- Header -->
            <header class="bg-blue-600 text-white p-5">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h1 class="text-xl font-bold">Yobell</h1>
                        <p class="text-xs text-blue-200">Data Kelompok</p>
                    </div>
                    <i class="fa-solid fa-user-circle text-3xl"></i>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Cari Kelompok / Nasabah..." class="w-full bg-white text-slate-800 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none">
                </div>
            </header>

            <!-- Filter Chips -->
            <div class="p-4 border-b">
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="day-filters"></div>
            </div>

            <!-- Group List -->
            <div class="flex-1 overflow-y-auto p-4 pb-24" id="group-list-container"></div>

            <!-- Sticky Add Button -->
            <div class="absolute bottom-0 w-full bg-white border-t p-4">
                <button onclick="openAddGroupModal()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg active:bg-blue-700">
                    + Tambah Kelompok
                </button>
            </div>
        </section>

        <!-- VIEW 2: TRANSAKSI -->
        <section id="view-transaction" class="view-section flex-col h-full w-full bg-slate-50">
            
            <!-- Header -->
            <header class="bg-white border-b p-4 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <button onclick="closeTransaction()" class="text-slate-600 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="font-bold text-lg" id="tx-group-name">Nama Kelompok</h2>
                            <button onclick="openEditNameModal()" class="text-blue-500 text-xs p-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="confirmDeleteGroup()" class="text-red-500 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <p class="text-xs text-slate-500" id="tx-group-day">Hari</p>
                    </div>
                </div>
            </header>

            <!-- Total Bar -->
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
                <span class="text-sm font-semibold">Total Terkumpul</span>
                <span class="text-xl font-bold" id="tx-total-collected">Rp 0</span>
            </div>

            <!-- Member List -->
            <div class="flex-1 overflow-y-auto p-4 pb-24">
                <button onclick="openAddCustomerModal()" class="w-full border-2 border-dashed border-blue-300 text-blue-600 font-semibold py-3 rounded-lg mb-4">
                    + Tambah Nasabah
                </button>
                <div id="tx-member-list"></div>
            </div>

            <!-- Sticky Save Button -->
            <div class="absolute bottom-0 w-full bg-white border-t p-4">
                <button onclick="saveTransaction()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg active:bg-blue-700">
                    Simpan Data
                </button>
            </div>
        </section>

    </main>

    <!-- KUMPULAN MODAL -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-sm p-5 shadow-lg relative">
            <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400"><i class="fa-solid fa-times"></i></button>
            <h3 class="font-bold text-lg mb-4" id="modal-title">Judul Modal</h3>
            <div id="modal-body" class="mb-5"></div>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-lg">Batal</button>
                <button id="modal-action-btn" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg">Simpan</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const defaultData = [
            {
                id: 'KLP-9999', nama_kelompok: 'KDBG putat 2', hari_pkm: 'Senin',
                nasabah: [
                    { id: 'N-901', nama: 'DAILAH BINTI RUSWAD', angsuran_wajib: 191000, catatan: '', status: '1. Bayar' },
                    { id: 'N-902', nama: 'WIWI LISTIYANA BINTI SUHANA', angsuran_wajib: 10000, catatan: '', status: '1. Bayar' },
                    { id: 'N-903', nama: 'NOKTITI BINTI KASMUDI', angsuran_wajib: 150000, catatan: '', status: '1. Bayar' },
                    { id: 'N-904', nama: 'ENI MASRUROH BINTI SARKO', angsuran_wajib: 215000, catatan: '', status: '1. Bayar' },
                    { id: 'N-905', nama: 'SITI QOMARIYAH BINTI DARYONO', angsuran_wajib: 825000, catatan: '', status: '1. Bayar' },
                    { id: 'N-906', nama: 'WARNINGSIH BINTI DARYONO', angsuran_wajib: 125000, catatan: '', status: '1. Bayar' },
                    { id: 'N-907', nama: 'NURIAH BINTI CARIWAN', angsuran_wajib: 30000, catatan: '', status: '1. Bayar' },
                    { id: 'N-908', nama: 'MUNETI BINTI TURWAN', angsuran_wajib: 0, catatan: '', status: '1. Bayar' },
                    { id: 'N-909', nama: 'NURITAH BINTI TARWIN', angsuran_wajib: 238000, catatan: '', status: '1. Bayar' },
                    { id: 'N-910', nama: 'SRI MULYATI BINTI SUTARMO', angsuran_wajib: 75000, catatan: '', status: '1. Bayar' },
                    { id: 'N-911', nama: 'SUARTI BINTI SUKYAD', angsuran_wajib: 0, catatan: '', status: '1. Bayar' },
                    { id: 'N-912', nama: 'WANITAH BINTI FATKHURI', angsuran_wajib: 191000, catatan: '', status: '1. Bayar' },
                    { id: 'N-913', nama: 'SANIPAH BINTI DARMAD', angsuran_wajib: 215000, catatan: '', status: '1. Bayar' },
                    { id: 'N-914', nama: 'SUSIYATI BINTI JAETUN', angsuran_wajib: 10100, catatan: '', status: '1. Bayar' },
                    { id: 'N-915', nama: 'KOMISAH BINTI KASTARI', angsuran_wajib: 243000, catatan: '', status: '1. Bayar' },
                    { id: 'N-916', nama: 'KOIMAH BINTI RASBIN', angsuran_wajib: 191000, catatan: '', status: '1. Bayar' },
                    { id: 'N-917', nama: 'WAITOH BINTI SAHID', angsuran_wajib: 191000, catatan: '', status: '1. Bayar' },
                    { id: 'N-918', nama: 'WAHYUNI YUNI WIDIYANTI BINTI ROBIN', angsuran_wajib: 191000, catatan: '', status: '1. Bayar' },
                    { id: 'N-919', nama: 'KAMILAH BINTI SAHID', angsuran_wajib: 175000, catatan: '', status: '1. Bayar' },
                    { id: 'N-920', nama: 'KASTIMAH BINTI SUPRIADI', angsuran_wajib: 175000, catatan: '', status: '1. Bayar' }
                ]
            },
            {
                id: 'KLP-1001', nama_kelompok: 'KDBG putat 3', hari_pkm: 'Senin',
                nasabah: [
                    { id: 'N-101', nama: 'Siti Aminah', angsuran_wajib: 50000, catatan: 'Ibu penjual gorengan pinggir jalan.', status: '1. Bayar' },
                    { id: 'N-102', nama: 'Nurhayati', angsuran_wajib: 50000, catatan: '', status: '1. Bayar' },
                    { id: 'N-103', nama: 'Karsini', angsuran_wajib: 75000, catatan: 'Rumah cat hijau dekat masjid.', status: '1. Bayar' },
                ]
            },
            {
                id: 'KLP-1002', nama_kelompok: 'KDBG putat', hari_pkm: 'Senin',
                nasabah: [
                    { id: 'N-201', nama: 'Budiarti', angsuran_wajib: 100000, catatan: '.', status: '1. Bayar' },
                    { id: 'N-202', nama: 'Sumiati', angsuran_wajib: 50000, catatan: '', status: '2. par' },
                ]
            },
            { id: 'KLP-1003', nama_kelompok: 'karang lo 2', hari_pkm: 'Senin', nasabah: [] },
            { id: 'KLP-1004', nama_kelompok: 'KDBG mda', hari_pkm: 'Senin', nasabah: [] },
            { id: 'KLP-1005', nama_kelompok: 'Kdbg MDA 2', hari_pkm: 'Senin', nasabah: [] },
            {
                id: 'KLP-2001', nama_kelompok: 'KARANG LO', hari_pkm: 'Senin',
                nasabah: [
                    { id: 'N-301', nama: 'Ratna', angsuran_wajib: 60000, catatan: 'Sering lupa bawa buku tabungan.', status: '1. Bayar' },
                    { id: 'N-302', nama: 'Desi', angsuran_wajib: 60000, catatan: '', status: '1. Bayar' },
                ]
            },
            {
                id: 'KLP-3001', nama_kelompok: 'Anggrek Bulan', hari_pkm: 'Rabu',
                nasabah: [
                    { id: 'N-401', nama: 'Wati', angsuran_wajib: 150000, catatan: 'Ketua Kelompok yang tegas.', status: '1. Bayar' },
                    { id: 'N-402', nama: 'Rina', angsuran_wajib: 150000, catatan: '', status: '3. Belum Angsuran' },
                ]
            },
            {
                id: 'KLP-4001', nama_kelompok: 'Teratai Mekar', hari_pkm: 'Kamis',
                nasabah: [
                    { id: 'N-501', nama: 'Juminten', angsuran_wajib: 40000, catatan: '', status: '1. Bayar' },
                    { id: 'N-502', nama: 'Tuminah', angsuran_wajib: 40000, catatan: 'Ibu pembuat tempe.', status: '1. Bayar' },
                    { id: 'N-503', nama: 'Suparti', angsuran_wajib: 80000, catatan: '', status: '3. Belum Angsuran' },
                ]
            },
            // Kelompok Baru Hari Kamis
            { id: 'KLP-5001', nama_kelompok: 'Tonggara Slawi', hari_pkm: 'Kamis', nasabah: [] },
            { id: 'KLP-5002', nama_kelompok: 'Tonggara Slawi 2', hari_pkm: 'Kamis', nasabah: [] },
            { id: 'KLP-5003', nama_kelompok: 'Tonggara 2', hari_pkm: 'Kamis', nasabah: [] },
            { id: 'KLP-5004', nama_kelompok: 'Tonggara Manis', hari_pkm: 'Kamis', nasabah: [] },
            { id: 'KLP-5005', nama_kelompok: 'Tonggara Manis 2', hari_pkm: 'Kamis', nasabah: [] },
            { id: 'KLP-5006', nama_kelompok: 'Tonggara Split', hari_pkm: 'Kamis', nasabah: [] }
        ];

        let mockData = JSON.parse(localStorage.getItem('mekaarDataV3')) || defaultData;
        function saveData() { localStorage.setItem('mekaarDataV3', JSON.stringify(mockData)); }

        let activeDayFilter = 'Semua';
        let searchQuery = '';
        let selectedGroupData = null;
        let selectedCustomerId = null;
        let modalActionType = '';
        const days = ['Semua', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka || 0);
        const generateId = (prefix) => prefix + '-' + Date.now().toString().slice(-4);

        window.onload = () => {
            renderDayFilters();
            renderDashboard();
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderDashboard();
            });
        };

        function renderDayFilters() {
            const container = document.getElementById('day-filters');
            container.innerHTML = days.map(day => `
                <button onclick="setFilter('${day}')" class="px-4 py-1.5 rounded-full text-sm font-semibold border whitespace-nowrap 
                    ${day === activeDayFilter ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600'}">
                    ${day}
                </button>
            `).join('');
        }

        function setFilter(day) {
            activeDayFilter = day;
            renderDayFilters();
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('group-list-container');
            const filtered = mockData.filter(g => 
                (activeDayFilter === 'Semua' || g.hari_pkm === activeDayFilter) &&
                (g.nama_kelompok.toLowerCase().includes(searchQuery) || g.nasabah.some(n => n.nama.toLowerCase().includes(searchQuery)))
            );

            container.innerHTML = filtered.length ? filtered.map(g => {
                const totalPotensi = g.nasabah.reduce((sum, n) => sum + n.angsuran_wajib, 0);
                return `
                <div onclick="openTransaction('${g.id}')" class="bg-white border p-4 rounded-lg mb-3 shadow-sm active:scale-95 transition-transform">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-lg">${g.nama_kelompok}</h3>
                        <span class="text-blue-500"><i class="fa-solid fa-chevron-right"></i></span>
                    </div>
                    <div class="flex gap-3 text-xs text-slate-500">
                        <span class="bg-slate-100 px-2 py-1 rounded"><i class="fa-solid fa-calendar mr-1"></i> ${g.hari_pkm}</span>
                        <span class="bg-slate-100 px-2 py-1 rounded"><i class="fa-solid fa-users mr-1"></i> ${g.nasabah.length} Org</span>
                        <span class="bg-slate-100 px-2 py-1 rounded font-bold"><i class="fa-solid fa-money-bill mr-1"></i> ${formatRp(totalPotensi)}</span>
                    </div>
                </div>
                `
            }).join('') : `<p class="text-center text-slate-400 mt-10">Data tidak ditemukan</p>`;
        }

        function openTransaction(groupId) {
            selectedGroupData = mockData.find(g => g.id === groupId);
            document.getElementById('tx-group-name').textContent = selectedGroupData.nama_kelompok;
            document.getElementById('tx-group-day').textContent = selectedGroupData.hari_pkm;
            
            renderTransactionForm();
            document.getElementById('view-dashboard').classList.remove('active');
            document.getElementById('view-transaction').classList.add('active');
        }

        function closeTransaction() {
            document.getElementById('view-transaction').classList.remove('active');
            document.getElementById('view-dashboard').classList.add('active');
            selectedGroupData = null;
            renderDashboard();
        }

        function renderTransactionForm() {
            const container = document.getElementById('tx-member-list');
            const options = ['1. Bayar', '2. par', '3. Belum Angsuran'];

            container.innerHTML = selectedGroupData.nasabah.map((n, i) => {
                let val = n.angsuran_wajib;
                if (n.nominal_bayar !== undefined) {
                    val = n.nominal_bayar;
                } else if (n.status === '3. Belum Angsuran') {
                    val = 0;
                }

                return `
                <div class="bg-white border p-4 rounded-lg mb-3 shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="font-bold">${i+1}. ${n.nama}</h4>
                            <p class="text-[10px] text-slate-400">Wajib: ${formatRp(n.angsuran_wajib)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openEditCustomerModal('${n.id}')" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="confirmDeleteCustomer('${n.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select onchange="updateMemberData('${n.id}', 'status', this.value)" class="w-1/2 bg-slate-50 border rounded p-2 text-sm font-semibold">
                            ${options.map(opt => `<option value="${opt}" ${n.status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                        <input type="number" oninput="updateMemberData('${n.id}', 'nominal', this.value)" id="nom-${n.id}" value="${val}" class="w-1/2 bg-slate-50 border rounded p-2 text-sm font-bold">
                    </div>
                </div>
                `;
            }).join('');
            
            calculateTotal();
        }

        function updateMemberData(id, type, value) {
            const member = selectedGroupData.nasabah.find(n => n.id === id);
            const inputEl = document.getElementById(`nom-${id}`);

            if(type === 'status') {
                member.status = value;
                if(value === '3. Belum Angsuran') {
                    inputEl.value = 0;
                    member.nominal_bayar = 0;
                } else if (value === '1. Bayar') {
                    inputEl.value = member.angsuran_wajib;
                    member.nominal_bayar = member.angsuran_wajib;
                }
            } else if (type === 'nominal') {
                member.nominal_bayar = parseInt(value) || 0;
            }
            
            saveData();
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('input[id^="nom-"]').forEach(input => {
                total += parseInt(input.value) || 0;
            });
            document.getElementById('tx-total-collected').textContent = formatRp(total);
        }

        function openModal(title, bodyHTML, actionType, btnText = "Simpan", btnColor = "bg-blue-600") {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            const actionBtn = document.getElementById('modal-action-btn');
            
            actionBtn.textContent = btnText;
            actionBtn.className = `flex-1 text-white font-bold py-2.5 rounded-lg ${btnColor}`;
            
            modalActionType = actionType;
            actionBtn.onclick = executeModalAction;
            
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
            modalActionType = '';
        }

        function openAddGroupModal() {
            const html = `
                <input type="text" id="inp-grp-name" placeholder="Nama Kelompok" class="w-full border rounded p-2 mb-3">
                <select id="inp-grp-day" class="w-full border rounded p-2">
                    ${days.filter(d => d !== 'Semua').map(d => `<option value="${d}">${d}</option>`).join('')}
                </select>
            `;
            openModal('Tambah Kelompok', html, 'ADD_GROUP');
        }

        function openEditNameModal() {
            const html = `<input type="text" id="inp-grp-name" value="${selectedGroupData.nama_kelompok}" class="w-full border rounded p-2">`;
            openModal('Ubah Nama', html, 'EDIT_GROUP');
        }

        function confirmDeleteGroup() {
            openModal('Hapus Kelompok?', '<p class="text-sm text-slate-500">Semua data nasabah di kelompok ini akan terhapus.</p>', 'DEL_GROUP', 'Ya, Hapus', 'bg-red-600');
        }

        function openAddCustomerModal() {
            const html = `
                <input type="text" id="inp-cus-name" placeholder="Nama Nasabah" class="w-full border rounded p-2 mb-3">
                <input type="number" id="inp-cus-nom" placeholder="Angsuran Wajib (Rp)" class="w-full border rounded p-2">
            `;
            openModal('Tambah Nasabah', html, 'ADD_CUSTOMER');
        }

        function openEditCustomerModal(id) {
            selectedCustomerId = id;
            const c = selectedGroupData.nasabah.find(n => n.id === id);
            const html = `
                <input type="text" id="inp-cus-name" value="${c.nama}" class="w-full border rounded p-2 mb-3">
                <input type="number" id="inp-cus-nom" value="${c.angsuran_wajib}" placeholder="Angsuran Wajib (Rp)" class="w-full border rounded p-2">
            `;
            openModal('Edit Nasabah', html, 'EDIT_CUSTOMER');
        }

        function confirmDeleteCustomer(id) {
            selectedCustomerId = id;
            openModal('Hapus Nasabah?', '<p class="text-sm text-slate-500">Yakin ingin menghapus nasabah ini?</p>', 'DEL_CUSTOMER', 'Hapus', 'bg-red-600');
        }

        function saveTransaction() {
            saveData();
            openModal('Tersimpan!', '<p class="text-center text-green-600 text-4xl"><i class="fa-solid fa-check-circle"></i></p>', 'CLOSE_TX');
        }

        function executeModalAction() {
            if (modalActionType === 'ADD_GROUP') {
                const name = document.getElementById('inp-grp-name').value;
                if(!name) return;
                mockData.unshift({ id: generateId('KLP'), nama_kelompok: name, hari_pkm: document.getElementById('inp-grp-day').value, nasabah: [] });
                setFilter(document.getElementById('inp-grp-day').value);
            } 
            else if (modalActionType === 'EDIT_GROUP') {
                selectedGroupData.nama_kelompok = document.getElementById('inp-grp-name').value;
                document.getElementById('tx-group-name').textContent = selectedGroupData.nama_kelompok;
            }
            else if (modalActionType === 'DEL_GROUP') {
                mockData = mockData.filter(g => g.id !== selectedGroupData.id);
                closeTransaction();
            }
            else if (modalActionType === 'ADD_CUSTOMER') {
                const name = document.getElementById('inp-cus-name').value;
                const nom = document.getElementById('inp-cus-nom').value;
                if(!name) return;
                selectedGroupData.nasabah.push({ id: generateId('N'), nama: name, angsuran_wajib: parseInt(nom)||0, nominal_bayar: parseInt(nom)||0, status: '1. Bayar' });
                renderTransactionForm();
            }
            else if (modalActionType === 'EDIT_CUSTOMER') {
                const c = selectedGroupData.nasabah.find(n => n.id === selectedCustomerId);
                c.nama = document.getElementById('inp-cus-name').value;
                const wajibBaru = parseInt(document.getElementById('inp-cus-nom').value) || 0;
                c.angsuran_wajib = wajibBaru;
                if(c.status === '1. Bayar') c.nominal_bayar = wajibBaru;
                renderTransactionForm();
            }
            else if (modalActionType === 'DEL_CUSTOMER') {
                selectedGroupData.nasabah = selectedGroupData.nasabah.filter(n => n.id !== selectedCustomerId);
                renderTransactionForm();
            }
            else if (modalActionType === 'CLOSE_TX') {
                closeModal();
                closeTransaction();
                return;
            }

            saveData();
            if(modalActionType.includes('GROUP')) renderDashboard();
            closeModal();
        }
    </script>
</body>
</html>
