<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kas AO - Catatan Angsuran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f1f5f9; /* slate-100 */
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .app-container {
            max-width: 480px; /* Ukuran maksimal HP */
            margin: 0 auto;
            background-color: #f8fafc; /* slate-50 */
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .switch-checkbox:checked {
            right: 0;
            border-color: #10B981;
        }
        .switch-checkbox:checked + .switch-label {
            background-color: #10B981;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-800">

    <div class="app-container flex flex-col">
        
        <!-- Header -->
        <header class="bg-brand-700 text-white p-4 sticky top-0 z-10 shadow-md rounded-b-2xl">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Catatan Angsuran</h1>
                    <p class="text-brand-100 text-xs mt-0.5">Pendampingan Nasabah PNM</p>
                </div>
                <div class="bg-brand-800 p-2 rounded-full h-10 w-10 flex items-center justify-center">
                    <i class="fas fa-user-tie text-lg"></i>
                </div>
            </div>
        </header>

        <!-- Summary Card -->
        <div class="px-4 -mt-2 relative z-20 pt-6">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-medium mb-1">Total Terkumpul Hari Ini</p>
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-bold text-brand-700" id="totalAmount">Rp 0</h2>
                    <div class="bg-green-100 text-green-600 p-2 rounded-lg">
                        <i class="fas fa-wallet text-xl"></i>
                    </div>
                </div>
                <div class="mt-3 flex items-center text-xs text-slate-500">
                    <span class="bg-slate-100 px-2 py-1 rounded mr-2" id="totalPaidCount">0 Lunas</span>
                    <span class="bg-slate-100 px-2 py-1 rounded" id="totalUnpaidCount">0 Belum</span>
                </div>
            </div>
        </div>

        <!-- Main Content (Scrollable) -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24">
            
            <!-- Input Form Accordion/Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden mb-6">
                <div class="bg-slate-50 p-3 border-b border-slate-100 flex justify-between items-center cursor-pointer" onclick="toggleForm()">
                    <h3 class="font-semibold text-slate-700 flex items-center">
                        <i class="fas fa-plus-circle text-brand-500 mr-2"></i> Tambah Nasabah
                    </h3>
                    <i class="fas fa-chevron-down text-slate-400 transition-transform duration-300" id="formIcon"></i>
                </div>
                
                <div id="formContainer" class="p-4 hidden">
                    <form id="nasabahForm" onsubmit="handleAddCustomer(event)">
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Nama Nasabah</label>
                            <input type="text" id="inputName" required placeholder="Contoh: Ibu Siti" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Nama Kelompok</label>
                            <input type="text" id="inputGroup" required placeholder="Contoh: Mawar 01" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Hari Kumpulan</label>
                            <select id="inputDay" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamis</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah Angsuran (Rp)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-500 text-sm font-medium">Rp</span>
                                <input type="number" id="inputAmount" required placeholder="50000" min="0" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-sm">
                            <i class="fas fa-save mr-1"></i> Simpan Data
                        </button>
                    </form>
                </div>
            </div>

            <!-- Search Section -->
            <div class="mb-4 relative">
                <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" onkeyup="handleSearch(event)" placeholder="Cari nama nasabah..." class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition-all">
            </div>

            <!-- List Section -->
            <div class="flex justify-between items-end mb-3">
                <h3 class="font-semibold text-slate-700">Daftar Tagihan</h3>
                <div class="text-xs text-brand-600 font-medium cursor-pointer" onclick="filterList('all')">Semua <span class="text-slate-300">|</span> 
                    <span class="text-slate-500 hover:text-brand-600" onclick="filterList('unpaid'); event.stopPropagation()">Belum Lunas</span>
                </div>
            </div>
            
            <div id="customerList" class="space-y-3">
                <!-- List items will be generated by JS -->
                <div class="text-center py-8 text-slate-400 text-sm" id="emptyState">
                    <i class="fas fa-box-open text-3xl mb-2 text-slate-300"></i>
                    <p>Belum ada data nasabah.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Modal Overlay (Hidden by default) -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white rounded-2xl shadow-xl w-11/12 max-w-sm mx-auto z-10 p-5 transform transition-all scale-95 opacity-0" id="modalContent">
            <div class="text-center mb-5">
                <div id="modalIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                    <i class="fas fa-exclamation-triangle text-red-600 text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1" id="modalTitle">Konfirmasi</h3>
                <p class="text-sm text-slate-500" id="modalMessage">Apakah Anda yakin ingin menghapus data ini?</p>
            </div>
            <div class="flex gap-3" id="modalActions">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <script>
        // State Management
        let customers = JSON.parse(localStorage.getItem('ao_customers')) || [];
        let currentFilter = 'all';
        let deleteIdPending = null;
        let searchQuery = '';

        // DOM Elements
        const formContainer = document.getElementById('formContainer');
        const formIcon = document.getElementById('formIcon');
        const nasabahForm = document.getElementById('nasabahForm');
        const customerList = document.getElementById('customerList');
        const emptyState = document.getElementById('emptyState');
        
        // Modal Elements
        const modal = document.getElementById('customModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalIcon = document.getElementById('modalIcon');
        const modalActions = document.getElementById('modalActions');

        // Utility Functions
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        const toggleForm = () => {
            formContainer.classList.toggle('hidden');
            if(formContainer.classList.contains('hidden')) {
                formIcon.classList.remove('rotate-180');
            } else {
                formIcon.classList.add('rotate-180');
                document.getElementById('inputName').focus();
            }
        };

        const saveToLocalStorage = () => {
            localStorage.setItem('ao_customers', JSON.stringify(customers));
        };

        // Custom Modal Logic
        const showModal = (type, title, message, onConfirm = null) => {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            
            modalActions.innerHTML = '';
            
            if (type === 'delete') {
                modalIcon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4';
                modalIcon.innerHTML = '<i class="fas fa-trash-alt text-red-600 text-xl"></i>';
                
                modalActions.innerHTML = `
                    <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg text-sm transition-colors">Batal</button>
                    <button onclick="${onConfirm}" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg text-sm transition-colors shadow-sm">Ya, Hapus</button>
                `;
            } else if (type === 'info') {
                modalIcon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-brand-100 mb-4';
                modalIcon.innerHTML = '<i class="fas fa-info-circle text-brand-600 text-xl"></i>';
                
                modalActions.innerHTML = `
                    <button onclick="closeModal()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm transition-colors shadow-sm">Mengerti</button>
                `;
            }

            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        const closeModal = () => {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
            deleteIdPending = null;
        };

        // Core Logic
        const updateTotal = () => {
            const paidCustomers = customers.filter(c => c.isPaid);
            const total = paidCustomers.reduce((sum, c) => sum + parseInt(c.amount), 0);
            
            document.getElementById('totalAmount').innerText = formatRupiah(total);
            document.getElementById('totalPaidCount').innerText = `${paidCustomers.length} Lunas`;
            document.getElementById('totalUnpaidCount').innerText = `${customers.length - paidCustomers.length} Belum`;
        };

        const filterList = (filterType) => {
            currentFilter = filterType;
            renderList();
        };

        const handleSearch = (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderList();
        };

        const handleAddCustomer = (e) => {
            e.preventDefault();
            
            const name = document.getElementById('inputName').value;
            const group = document.getElementById('inputGroup').value;
            const amount = document.getElementById('inputAmount').value;
            const day = document.getElementById('inputDay').value;

            const newCustomer = {
                id: Date.now().toString(),
                name: name,
                group: group,
                amount: amount,
                day: day,
                isPaid: false,
                dateAdded: new Date().toISOString()
            };

            customers.unshift(newCustomer); // Tambah di paling atas
            saveToLocalStorage();
            
            // Reset form
            nasabahForm.reset();
            toggleForm(); 
            
            renderList();
            
            // Tampilkan info singkat
            showModal('info', 'Berhasil', `${name} berhasil ditambahkan ke daftar tagihan.`);
        };

        const togglePaidStatus = (id) => {
            const index = customers.findIndex(c => c.id === id);
            if (index !== -1) {
                customers[index].isPaid = !customers[index].isPaid;
                saveToLocalStorage();
                renderList();
            }
        };

        const confirmDelete = (id) => {
            deleteIdPending = id;
            const customer = customers.find(c => c.id === id);
            showModal('delete', 'Hapus Data', `Hapus data nasabah ${customer.name}?`, 'executeDelete()');
        };

        const executeDelete = () => {
            if (deleteIdPending) {
                customers = customers.filter(c => c.id !== deleteIdPending);
                saveToLocalStorage();
                renderList();
                closeModal();
            }
        };

        const renderList = () => {
            let filteredCustomers = customers;
            
            if (currentFilter === 'unpaid') {
                filteredCustomers = customers.filter(c => !c.isPaid);
            }

            if (searchQuery) {
                filteredCustomers = filteredCustomers.filter(c => c.name.toLowerCase().includes(searchQuery));
            }

            if (filteredCustomers.length === 0) {
                customerList.innerHTML = '';
                emptyState.style.display = 'block';
                
                if(customers.length > 0 && currentFilter === 'unpaid' && !searchQuery) {
                   emptyState.innerHTML = `<i class="fas fa-check-circle text-4xl mb-2 text-green-400"></i><p>Hebat! Semua nasabah sudah lunas.</p>`;
                } else if (searchQuery) {
                   emptyState.innerHTML = `<i class="fas fa-search text-4xl mb-2 text-slate-300"></i><p>Nasabah tidak ditemukan.</p>`;
                } else {
                   emptyState.innerHTML = `<i class="fas fa-box-open text-4xl mb-2 text-slate-300"></i><p>Belum ada data nasabah.</p>`;
                }
                customerList.appendChild(emptyState);
                updateTotal();
                return;
            }

            emptyState.style.display = 'none';
            customerList.innerHTML = '';

            // Pengelompokan berdasarkan Hari
            const dayOrder = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Lainnya'];
            const grouped = {};
            
            filteredCustomers.forEach(customer => {
                const day = customer.day || 'Lainnya';
                if (!grouped[day]) grouped[day] = [];
                grouped[day].push(customer);
            });

            dayOrder.forEach(day => {
                if (grouped[day] && grouped[day].length > 0) {
                    // Buat Header Grup Hari
                    const header = document.createElement('div');
                    header.className = 'bg-brand-50 text-brand-700 font-bold px-3 py-1.5 rounded-lg mb-2 mt-4 text-xs tracking-wide uppercase border border-brand-100 flex justify-between items-center';
                    header.innerHTML = `<span>Hari ${day}</span> <span class="bg-brand-200 text-brand-800 px-2 py-0.5 rounded-full text-[10px]">${grouped[day].length} Orang</span>`;
                    customerList.appendChild(header);

                    // Buat Kartu Nasabah di bawah grup tersebut
                    grouped[day].forEach(customer => {
                        const card = document.createElement('div');
                        const cardClass = customer.isPaid 
                            ? 'bg-white border-l-4 border-l-green-500 opacity-80' 
                            : 'bg-white border-l-4 border-l-amber-400 shadow-sm';
                        
                        card.className = `${cardClass} rounded-r-xl p-4 flex flex-col gap-3 border-t border-r border-b border-slate-100 mb-3 transition-all duration-300`;
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-slate-800 leading-tight ${customer.isPaid ? 'line-through text-slate-500' : ''}">${customer.name}</h4>
                                    <div class="flex items-center text-xs text-slate-500 mt-1">
                                        <i class="fas fa-users mr-1.5 text-slate-400"></i> ${customer.group}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold text-brand-700 whitespace-nowrap">${formatRupiah(customer.amount)}</div>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center pt-3 border-t border-slate-100 mt-1">
                                <div class="flex items-center" onclick="togglePaidStatus('${customer.id}')">
                                    <div class="relative w-12 h-6 mr-2 bg-slate-200 rounded-full cursor-pointer transition-colors ${customer.isPaid ? 'bg-green-500' : ''}">
                                        <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform transform ${customer.isPaid ? 'translate-x-6' : ''} shadow-sm"></div>
                                    </div>
                                    <span class="text-xs font-semibold ${customer.isPaid ? 'text-green-600' : 'text-amber-600'} cursor-pointer">
                                        ${customer.isPaid ? '<i class="fas fa-check mr-1"></i> Sudah Bayar' : '<i class="fas fa-clock mr-1"></i> Belum'}
                                    </span>
                                </div>
                                
                                <button onclick="confirmDelete('${customer.id}')" class="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50">
                                    <i class="fas fa-trash-alt text-sm"></i>
                                </button>
                            </div>
                        `;
                        customerList.appendChild(card);
                    });
                }
            });

            updateTotal();
        };

        // Initialize application on load
        document.addEventListener('DOMContentLoaded', () => {
            renderList();
        });
    </script>
</body>
</html>
